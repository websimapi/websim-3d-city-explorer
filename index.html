    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading City...</div>

        <p>WASD or Arrow Keys to move</p>
        <p>Mouse to look around</p>
        <p>Space to jump</p>
        <p>Click to begin exploration</p>
